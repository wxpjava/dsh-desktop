name: Build macOS (dmg + zip)

on:
  # 手动触发：仓库页面 Actions → Build macOS → Run workflow
  workflow_dispatch: {}
  # 打 tag（v*）时自动触发（可选）
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon（M 系列）
          - runner: macos-14
            arch: arm64
          # Intel Mac
          - runner: macos-13
            arch: x64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout dsh-desktop
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      # DSH 源码默认拉官方仓库（deepseek-ai/deepseek-harness），浅克隆到工作区外。
      # 想用自己的 fork（带本地改动）时：仓库 Settings → Secrets and variables →
      # Actions → Variables 里添加 DSH_REPO，值填你的仓库地址，例如
      #   https://github.com/你的用户名/deepseek-harness.git
      # （若是私有 fork，还需在 Secrets 配 DSH_REPO_TOKEN，并在下方 clone 命令带 token）
      - name: Clone DSH checkout
        env:
          DSH_REPO: ${{ vars.DSH_REPO }}
        run: git clone --depth 1 "${DSH_REPO:-https://github.com/deepseek-ai/deepseek-harness.git}" ../deepseek-harness

      - name: Install DSH dependencies
        run: pnpm install
        working-directory: ../deepseek-harness

      - name: Install desktop dependencies
        run: npm install

      # 组装 Mac 版 host（下载 Darwin Node + 安装 arm64/x64 原生依赖）→ 打 dmg + zip
      - name: Assemble host and build (${{ matrix.arch }})
        run: node scripts/rebuild.cjs --checkout ../deepseek-harness

      - name: Upload artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
